tick:
  hz: 2.0

llm:
  concurrency: 4

agent:
  perception_radius: 6
  # 对人操作暂走视野+LOS；听觉半径保留，暂不用于可达性
  audio_radius: 10
  observation_refresh_ticks: 2
  move_speed_px: 80.0
  action_log_max: 8
  starting_agents: 5
  los: true
  los_block: [tree, mountain]

control:
  mode: agent   # manual | agent；F3 切换。新开局默认自主，观察者立刻能看到规则在跑

observer:
  default_god: true
  god_vision_overlay: true

time:
  enabled: true
  day_length_ticks: 240
  dawn_end: 0.12
  day_end: 0.55
  dusk_end: 0.70
  night_perception_scale: 0.6
  sleep_max_ticks: 240
  phase_bar_width: 8
  tint:
    dawn: [1.0, 0.82, 0.68]
    day: [1.0, 1.0, 1.0]
    dusk: [0.92, 0.62, 0.48]
    night: [0.32, 0.38, 0.62]

save:
  enabled: true
  autosave_ticks: 25
  filename: world.json

movement:
  stuck_abort_s: 1.5
  stuck_min_displacement_px: 2.0

emote:
  display_seconds: 2.5
  max_chars: 8

vitals:
  enabled: true
  base_max: 100
  energy_floor: 40
  satiety_floor: 35
  hungry_sleep_below: 25
  hungry_energy_below: 25
  starving_energy_below: 8
  hungry_energy_scale: 1.18
  starving_energy_scale: 1.4
  low_energy_speed_below: 14
  low_energy_speed_scale: 0.82
  min_night_sleep_ticks: 36
  missed_night_energy_penalty: 10
  extra_night_energy_penalty: 4
  slept_night_energy_recover: 6
  missed_day_satiety_penalty: 12
  extra_day_satiety_penalty: 5
  ate_day_satiety_recover: 7
  missed_day_energy_penalty: 4
  food_inventory_max: 5
  starting_food: [berry_bush, berry_bush]
  health:
    max: 100
    miss_sleep: 5
    extra_sleep: 4
    miss_food: 6
    extra_food: 4
    both_extra: 3
    recover_both: 7
    recover_one: 2
    frail_below: 35
    frail_drain_scale: 1.25
    frail_sleep_scale: 0.75
    slow_below: 20
    slow_scale: 0.8
  bar:
    energy: true
    satiety: true
    health: true
  drain:
    energy_idle: 0.18
    energy_walk: 0.06
    energy_night_awake: 0.32
    energy_sleep_restore: 1.15
    energy_day_sleep_scale: 0.06
    energy_hungry_sleep_scale: 0.55
    satiety_idle: 0.22
    satiety_walk: 0.04
    satiety_sleep: 0.14

decision:
  skip_while_walking: false
  repeat_say_block_ticks: 40
  min_ticks_between: 2
  max_say_chars: 180
  wait_max_ticks: 20

exploration:
  share_consensus_ticks: 60
  stale_overlay: true
  stale_tint: [0.85, 0.12, 0.62, 0.55]
  frontier_prompt_max: 8
  local_move_radius: 1
  dwell_hint_ticks: 24
  dwell_radius: 2

memory:
  importance_threshold_for_permanent: 0.7
  decay_interval_ticks: 50
  decay_amount: 0.02
  reflection:
    trigger_events: 20
    trigger_ticks: 200
    lookback: 50
  retrieval:
    top_k: 8
    time_window_ticks: 600
    recency_weight: 0.3
    similarity_weight: 0.7
    importance_weight: 0.2
    vector:
      enabled: true
      dim: 64
    drop_future_ticks: true
    origin_cluster_tick: 1
    origin_recency_scale: 0.25
    collapse_same_tick:
      - plan
      - reflection
    exclude_categories:
      - observation
      - decision
  hud:
    display_limit: 50
    categories:
      - action
      - action_failed
      - reflection
      - plan

planning:
  trigger_ticks: 80
  max_steps: 7

goals:
  survive: 活下去
  survive_detail: 死亡不可逆。健康在每个黎明结算：连续缺觉或断食会下降，降至 0 即死亡。没有自杀原语。

relationships:
  greet_familiarity: 0.35
  on_say_to:
    familiarity: 0.06
    affinity: 0.04
    trust: 0.02
  on_heard:
    familiarity: 0.04
    affinity: 0.02
    trust: 0.01
  on_co_presence:
    familiarity: 0.01
  on_give:
    familiarity: 0.08
    affinity: 0.06
    trust: 0.05
  on_received:
    familiarity: 0.06
    affinity: 0.05
    trust: 0.04

persona_drift:
  max_per_trait: 0.15
  reflection_jitter: 0.02

observability:
  snapshot_interval_ticks: 25
  stuck_tile_threshold: 3
  repeat_say_window_ticks: 40
