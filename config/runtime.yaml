tick:
  hz: 2.0

llm:
  concurrency: 4

agent:
  perception_radius: 6
  audio_radius: 10
  observation_refresh_ticks: 2
  move_speed_px: 80.0
  action_log_max: 8
  starting_agents: 5

control:
  mode: manual   # manual | agent

decision:
  skip_while_walking: true

memory:
  importance_threshold_for_permanent: 0.7
  decay_interval_ticks: 50
  decay_amount: 0.02
  reflection:
    trigger_events: 10
    trigger_ticks: 100
    lookback: 50
  retrieval:
    top_k: 8
    time_window_ticks: 600
    recency_weight: 0.3
    similarity_weight: 0.7
    importance_weight: 0.2
  hud:
    display_limit: 50

planning:
  trigger_ticks: 50
  max_steps: 7

relationships:
  greet_familiarity: 0.35
  on_say_to:
    familiarity: 0.06
    affinity: 0.04
    trust: 0.02
  on_heard:
    familiarity: 0.04
    affinity: 0.02
    trust: 0.01
  on_co_presence:
    familiarity: 0.01
  on_give:
    familiarity: 0.08
    affinity: 0.06
    trust: 0.05
  on_received:
    familiarity: 0.06
    affinity: 0.05
    trust: 0.04

persona_drift:
  max_per_trait: 0.15
  reflection_jitter: 0.02
