tick:
  hz: 2.0

llm:
  concurrency: 3

agent:
  perception_radius: 6
  audio_radius: 10
  observation_refresh_ticks: 2
  move_speed_px: 80.0
  action_log_max: 8
  starting_agents: 5
  los: true
  los_block: [tree, mountain]

control:
  mode: agent   # manual | agent；F3 切换。新开局默认自主，观察者立刻能看到规则在跑

observer:
  default_god: true
  god_vision_overlay: true

save:
  enabled: true
  autosave_ticks: 25
  filename: world.json

movement:
  stuck_abort_s: 1.5
  stuck_min_displacement_px: 2.0

decision:
  skip_while_walking: true
  repeat_say_block_ticks: 40
  min_ticks_between: 2
  max_say_chars: 180
  wait_max_ticks: 20

exploration:
  share_consensus_ticks: 60

memory:
  importance_threshold_for_permanent: 0.7
  decay_interval_ticks: 50
  decay_amount: 0.02
  reflection:
    trigger_events: 20
    trigger_ticks: 200
    lookback: 50
  retrieval:
    top_k: 8
    time_window_ticks: 600
    recency_weight: 0.3
    similarity_weight: 0.7
    importance_weight: 0.2
    drop_future_ticks: true
    origin_cluster_tick: 1
    origin_recency_scale: 0.25
    collapse_same_tick:
      - plan
      - reflection
    exclude_categories:
      - observation
      - decision
  hud:
    display_limit: 50
    categories:
      - action
      - action_failed
      - reflection
      - plan

planning:
  trigger_ticks: 80
  max_steps: 7

relationships:
  greet_familiarity: 0.35
  on_say_to:
    familiarity: 0.06
    affinity: 0.04
    trust: 0.02
  on_heard:
    familiarity: 0.04
    affinity: 0.02
    trust: 0.01
  on_co_presence:
    familiarity: 0.01
  on_give:
    familiarity: 0.08
    affinity: 0.06
    trust: 0.05
  on_received:
    familiarity: 0.06
    affinity: 0.05
    trust: 0.04

persona_drift:
  max_per_trait: 0.15
  reflection_jitter: 0.02

observability:
  snapshot_interval_ticks: 25
  stuck_tile_threshold: 3
  repeat_say_window_ticks: 40
